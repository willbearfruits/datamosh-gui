name: Build and Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name Datamosh \
            --add-data "README.md:." \
            --add-data "LICENSE:." \
            --add-data "VERSION:." \
            main.py

      - name: Create release artifacts
        run: |
          mkdir -p release-artifacts
          tar -C dist -czf "release-artifacts/Datamosh-${VERSION}-linux-portable.tar.gz" Datamosh
          ./packaging/linux/build_deb.sh "$VERSION" "dist/Datamosh" "release-artifacts"
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS-linux.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-artifacts/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          Set-Content -Path VERSION -Value $version -NoNewline
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name Datamosh `
            --add-data "README.md;." `
            --add-data "LICENSE;." `
            --add-data "VERSION;." `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Create release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path dist\Datamosh\* -DestinationPath "release-artifacts\Datamosh-$env:VERSION-windows-portable.zip"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$pwd\dist\Datamosh" "/DOutDir=$pwd\release-artifacts" "/DOutName=Datamosh-$env:VERSION-windows-installer" "packaging\windows\datamosh.iss"
          Get-ChildItem release-artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content "release-artifacts\SHA256SUMS-windows.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/*

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name Datamosh \
            --add-data "README.md:." \
            --add-data "LICENSE:." \
            --add-data "VERSION:." \
            main.py

      - name: Create release artifacts
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/Datamosh.app "release-artifacts/Datamosh-${VERSION}-macos-portable.zip"
          hdiutil create -volname "Datamosh" -srcfolder "dist/Datamosh.app" -ov -format UDZO "release-artifacts/Datamosh-${VERSION}-macos-installer.dmg"
          shasum -a 256 release-artifacts/* > release-artifacts/SHA256SUMS-macos.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-macos
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
