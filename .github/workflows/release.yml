name: Build and Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name Datamosh \
            --add-data "README.md:." \
            --add-data "LICENSE:." \
            --add-data "VERSION:." \
            main.py

      - name: Create release artifacts
        run: |
          mkdir -p release-artifacts
          tar -C dist -czf "release-artifacts/Datamosh-${VERSION}-linux-portable.tar.gz" Datamosh
          ./packaging/linux/build_deb.sh "$VERSION" "dist/Datamosh" "release-artifacts"
          ./packaging/linux/build_appimage.sh "$VERSION" "dist/Datamosh" "release-artifacts"
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS-linux.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-artifacts/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          Set-Content -Path VERSION -Value $version -NoNewline
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download FFmpeg for bundling
        shell: pwsh
        run: |
          # Ship ffmpeg/ffprobe inside the Windows build so the app works on
          # machines without ffmpeg on PATH (gui/ffmpeg_env.ensure_ffmpeg_on_path
          # prepends the bundled "ffmpeg" dir at startup). GPL build is fine for a
          # GPL-3.0 project. Pin to a specific release for reproducible builds.
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-zip -Force
          New-Item -ItemType Directory -Force -Path ffmpeg-bin | Out-Null
          $ff = Get-ChildItem -Path ffmpeg-zip -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem -Path ffmpeg-zip -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName ffmpeg-bin/ffmpeg.exe
          Copy-Item $fp.FullName ffmpeg-bin/ffprobe.exe

      - name: Build app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name Datamosh `
            --add-data "README.md;." `
            --add-data "LICENSE;." `
            --add-data "VERSION;." `
            --add-binary "ffmpeg-bin/ffmpeg.exe;ffmpeg" `
            --add-binary "ffmpeg-bin/ffprobe.exe;ffmpeg" `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Create release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path dist\Datamosh\* -DestinationPath "release-artifacts\Datamosh-$env:VERSION-windows-portable.zip"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$pwd\dist\Datamosh" "/DOutDir=$pwd\release-artifacts" "/DOutName=Datamosh-$env:VERSION-windows-installer" "packaging\windows\datamosh.iss"
          Get-ChildItem release-artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content "release-artifacts\SHA256SUMS-windows.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/*

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name Datamosh \
            --add-data "README.md:." \
            --add-data "LICENSE:." \
            --add-data "VERSION:." \
            main.py

      - name: Create release artifacts
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/Datamosh.app "release-artifacts/Datamosh-${VERSION}-macos-portable.zip"
          hdiutil create -volname "Datamosh" -srcfolder "dist/Datamosh.app" -ov -format UDZO "release-artifacts/Datamosh-${VERSION}-macos-installer.dmg"
          shasum -a 256 release-artifacts/* > release-artifacts/SHA256SUMS-macos.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - build-linux
      - build-windows
      - build-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: |
          ls -lah release-artifacts || true

      - name: Check artifacts exist
        id: artifact_check
        run: |
          if compgen -G "release-artifacts/*" > /dev/null; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: ${{ steps.artifact_check.outputs.has_artifacts == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: Datamosh ${{ github.ref_name }}
          files: release-artifacts/*
          body_path: RELEASE_BODY.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
