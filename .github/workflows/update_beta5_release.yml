name: Update Beta 5 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_BODY.md
      - .github/workflows/update_beta5_release.yml

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply release body to v1.1.0-beta.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-beta.5
          name: Datamosh v1.1.0-beta.5 (Linux/macOS)
          body_path: RELEASE_BODY.md
          prerelease: true
          fail_on_unmatched_files: false
